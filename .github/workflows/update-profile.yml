name: Update profile

on:
  schedule:
    - cron: "17 2 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PROFILE_STATS_TOKEN: a personal access token saved as a repository secret,
      # so private contributions are counted. Classic token scope: read:user.
      - name: Render activity card, merged PRs and posts
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/update_profile.py "${{ github.repository_owner }}"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md profile/*.svg
          git commit -m "Update profile" || exit 0
          git push
